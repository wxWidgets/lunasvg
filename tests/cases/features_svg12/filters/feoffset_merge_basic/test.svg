<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <filter id="dropshadow">
      <!-- Create a red shadow behind the source graphic -->
      <feFlood flood-color="red" flood-opacity="0.5" result="flood"/>
      <feOffset in="SourceGraphic" dx="10" dy="10" result="offset"/>
      <feMerge>
        <feMergeNode in="flood"/>
        <feMergeNode in="offset"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="30" y="30" width="100" height="100" fill="blue" filter="url(#dropshadow)"/>
</svg>
