<svg width="300" height="80" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="blendNormal" filterUnits="userSpaceOnUse" x="0" y="0" width="50" height="50">
      <feImage result="red" x="0" y="0" width="50" height="50" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><circle cx='20' cy='25' r='18' fill='rgba(255,0,0,0.7)'/></svg>"/>
      <feImage result="green" x="0" y="0" width="50" height="50" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><rect x='16' y='16' width='34' height='34' fill='rgba(0,255,0,0.7)'/></svg>"/>
      <feBlend in="red" in2="green" mode="normal"/>
    </filter>
    <filter id="blendMultiply" filterUnits="userSpaceOnUse" x="0" y="0" width="50" height="50">
      <feImage result="red" x="0" y="0" width="50" height="50" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><circle cx='20' cy='25' r='18' fill='rgba(255,0,0,0.7)'/></svg>"/>
      <feImage result="green" x="0" y="0" width="50" height="50" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><rect x='16' y='16' width='34' height='34' fill='rgba(0,255,0,0.7)'/></svg>"/>
      <feBlend in="red" in2="green" mode="multiply"/>
    </filter>
    <filter id="blendScreen" filterUnits="userSpaceOnUse" x="0" y="0" width="50" height="50">
      <feImage result="red" x="0" y="0" width="50" height="50" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><circle cx='20' cy='25' r='18' fill='rgba(255,0,0,0.7)'/></svg>"/>
      <feImage result="green" x="0" y="0" width="50" height="50" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><rect x='16' y='16' width='34' height='34' fill='rgba(0,255,0,0.7)'/></svg>"/>
      <feBlend in="red" in2="green" mode="screen"/>
    </filter>
    <filter id="blendDarken" filterUnits="userSpaceOnUse" x="0" y="0" width="50" height="50">
      <feImage result="red" x="0" y="0" width="50" height="50" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><circle cx='20' cy='25' r='18' fill='rgba(255,0,0,0.7)'/></svg>"/>
      <feImage result="green" x="0" y="0" width="50" height="50" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><rect x='16' y='16' width='34' height='34' fill='rgba(0,255,0,0.7)'/></svg>"/>
      <feBlend in="red" in2="green" mode="darken"/>
    </filter>
    <filter id="blendLighten" filterUnits="userSpaceOnUse" x="0" y="0" width="50" height="50">
      <feImage result="red" x="0" y="0" width="50" height="50" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><circle cx='20' cy='25' r='18' fill='rgba(255,0,0,0.7)'/></svg>"/>
      <feImage result="green" x="0" y="0" width="50" height="50" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50'><rect x='16' y='16' width='34' height='34' fill='rgba(0,255,0,0.7)'/></svg>"/>
      <feBlend in="red" in2="green" mode="lighten"/>
    </filter>
  </defs>

  <rect x="5" y="15" width="50" height="50" fill="white" filter="url(#blendNormal)"/>
  <rect x="65" y="15" width="50" height="50" fill="white" filter="url(#blendMultiply)"/>
  <rect x="125" y="15" width="50" height="50" fill="white" filter="url(#blendScreen)"/>
  <rect x="185" y="15" width="50" height="50" fill="white" filter="url(#blendDarken)"/>
  <rect x="245" y="15" width="50" height="50" fill="white" filter="url(#blendLighten)"/>
</svg>
