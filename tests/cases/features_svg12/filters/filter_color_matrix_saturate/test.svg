<svg width="300" height="100" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="red"/>
      <stop offset="50%" stop-color="green"/>
      <stop offset="100%" stop-color="blue"/>
    </linearGradient>
    <filter id="sat1"><feColorMatrix type="saturate" values="1"/></filter>
    <filter id="sat05"><feColorMatrix type="saturate" values="0.5"/></filter>
    <filter id="sat0"><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect x="10" y="10" width="80" height="80" fill="url(#gradient)" filter="url(#sat1)"/>
  <rect x="110" y="10" width="80" height="80" fill="url(#gradient)" filter="url(#sat05)"/>
  <rect x="210" y="10" width="80" height="80" fill="url(#gradient)" filter="url(#sat0)"/>
</svg>
