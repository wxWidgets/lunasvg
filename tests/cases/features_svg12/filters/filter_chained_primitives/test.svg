<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="chain" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feColorMatrix in="blur" type="hueRotate" values="90" result="hue"/>
      <feOffset in="hue" dx="10" dy="10" result="offset"/>
      <feMerge>
        <feMergeNode in="offset"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <polygon points="100,20 117,80 180,80 130,115 150,175 100,140 50,175 70,115 20,80 83,80" fill="royalblue" filter="url(#chain)"/>
</svg>
