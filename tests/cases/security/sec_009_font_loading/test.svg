<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- SEC-009: Font Loading Information Disclosure Test -->
  <!-- Tests various font families to observe font loading behavior -->
  
  <!-- Common system fonts -->
  <text x="10" y="30" font-family="Arial" font-size="14" fill="black">
    Arial font test
  </text>
  
  <text x="10" y="60" font-family="Times New Roman" font-size="14" fill="black">
    Times New Roman font test
  </text>
  
  <text x="10" y="90" font-family="Courier New" font-size="14" fill="black">
    Courier New font test
  </text>
  
  <!-- Potentially non-existent fonts -->
  <text x="10" y="120" font-family="NonExistentFont123" font-size="14" fill="red">
    Non-existent font test
  </text>
  
  <!-- Path-like font names (should be rejected) -->
  <text x="10" y="150" font-family="../../../etc/passwd" font-size="14" fill="red">
    Path traversal font test
  </text>
  
  <text x="10" y="180" font-family="C:/Windows/System32/config/sam" font-size="14" fill="red">
    Absolute path font test
  </text>
  
  <!-- Multiple fonts in fallback chain -->
  <text x="10" y="210" font-family="CustomFont, Arial, sans-serif" font-size="14" fill="blue">
    Font fallback chain test
  </text>
  
  <!-- Generic font families -->
  <text x="10" y="240" font-family="serif" font-size="14" fill="green">
    Generic serif font
  </text>
  
  <text x="10" y="270" font-family="sans-serif" font-size="14" fill="green">
    Generic sans-serif font
  </text>
  
  <!-- Note at bottom -->
  <rect x="5" y="280" width="390" height="15" fill="yellow" stroke="black"/>
  <text x="200" y="291" font-size="10" text-anchor="middle" fill="black">
    Monitor file system access to observe font loading behavior
  </text>
</svg>
